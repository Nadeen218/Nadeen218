<svg xmlns="http://www.w3.org/2000/svg" width="950" height="540" viewBox="0 0 950 540">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>

    <!-- Terminal Border Glow -->
    <linearGradient id="terminal-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" />
      <stop offset="50%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>

    <!-- Green Text Glow Filter -->
    <filter id="green-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace; }
    .green-text { fill: #3fb950; }
    .green-glow { fill: #3fb950; filter: url(#green-glow); }
    .blue-text { fill: #58a6ff; }
    .gray-text { fill: #8b949e; }
    .white-text { fill: #f0f6fc; }
  </style>

  <!-- Outer Window Frame -->
  <rect width="950" height="540" rx="12" fill="url(#bg-grad)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="948" height="538" rx="11" fill="none" stroke="url(#terminal-border)" stroke-width="1" opacity="0.4"/>

  <!-- Top Window Header / Titlebar -->
  <path d="M 0,12 A 12,12 0 0,1 12,0 L 938,0 A 12,12 0 0,1 950,12 L 950,38 L 0,38 Z" fill="#161b22"/>
  <line x1="0" y1="38" x2="950" y2="38" stroke="#30363d" stroke-width="1"/>

  <!-- Window Control Buttons -->
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>

  <!-- Window Title & Online Status -->
  <text x="475" y="24" class="mono gray-text" font-size="12" text-anchor="middle">nadeen218 ~ % ./profile.sh</text>
  <circle cx="855" cy="19" r="4" fill="#3fb950" class="green-glow"/>
  <text x="925" y="23" class="mono green-text" font-size="11" font-weight="bold" text-anchor="end">ONLINE</text>

  <!-- Left Side Box (SYSTEM.ID & VECTOR ROBOT) -->
  <rect x="20" y="52" width="480" height="468" rx="8" fill="#010409" stroke="#21262d" stroke-width="1"/>
  
  <text x="36" y="78" class="mono blue-text" font-size="13" font-weight="bold">+ SYSTEM.ID ---------------------------------------+</text>
  <text x="36" y="100" class="mono green-glow" font-size="13" font-weight="bold">01001110 01000001</text>

  <!-- High Precision Vector Cyber Robot -->
  <g transform="translate(160, 115)" stroke="#3fb950" stroke-width="2" fill="none" filter="url(#green-glow)">
    <!-- Antenna -->
    <line x1="80" y1="0" x2="80" y2="15" />
    <circle cx="80" cy="0" r="3" fill="#3fb950" />

    <!-- Robot Head -->
    <rect x="35" y="15" width="90" height="60" rx="10" stroke="#3fb950" stroke-width="2" fill="#0d1117"/>
    <!-- Screen Face -->
    <rect x="45" y="23" width="70" height="44" rx="5" stroke="#2ea043" stroke-width="1" fill="#010409"/>
    <!-- Glowing Eyes -->
    <circle cx="62" cy="42" r="6" fill="#3fb950"/>
    <circle cx="98" cy="42" r="6" fill="#3fb950"/>
    <!-- Digital Smile / Line -->
    <path d="M 68 55 Q 80 62 92 55" stroke="#3fb950" stroke-width="2" fill="none" />

    <!-- Neck -->
    <line x1="70" y1="75" x2="70" y2="85" />
    <line x1="90" y1="75" x2="90" y2="85" />

    <!-- Chest Body -->
    <rect x="25" y="85" width="110" height="90" rx="8" stroke="#3fb950" stroke-width="2" fill="#0d1117"/>
    
    <!-- Chest Screen & Code Details -->
    <rect x="37" y="97" width="86" height="66" rx="4" stroke="#2ea043" stroke-width="1" fill="#010409"/>
    <text x="45" y="115" class="mono green-text" font-size="10" stroke="none" fill="#3fb950">&lt;/&gt; {code}</text>
    <text x="45" y="132" class="mono green-text" font-size="10" stroke="none" fill="#3fb950">:= [data]</text>
    <text x="45" y="149" class="mono green-text" font-size="9" stroke="none" fill="#3fb950">#@*+==::.##</text>

    <!-- Arms -->
    <!-- Left Arm -->
    <path d="M 25 100 L 5 115 L 5 145 L 20 150" stroke="#3fb950" stroke-width="2"/>
    <circle cx="5" cy="145" r="3" fill="#3fb950"/>
    <!-- Right Arm -->
    <path d="M 135 100 L 155 115 L 155 145 L 140 150" stroke="#3fb950" stroke-width="2"/>
    <circle cx="155" cy="145" r="3" fill="#3fb950"/>

    <!-- Base / Stand Legs -->
    <path d="M 50 175 L 40 200 M 110 175 L 120 200" stroke="#3fb950" stroke-width="2"/>
    <rect x="30" y="200" width="20" height="6" rx="2" fill="#3fb950"/>
    <rect x="110" y="200" width="20" height="6" rx="2" fill="#3fb950"/>
  </g>

  <!-- Left Card Bottom Text Info -->
  <text x="36" y="375" class="mono blue-text" font-size="12" font-weight="bold">&lt; SOFTWARE ENGINEER /&gt;</text>
  <text x="36" y="400" class="mono white-text" font-size="11">[#] SOFTWARE ENGINEER</text>
  <text x="36" y="420" class="mono white-text" font-size="11">[#] DATA ANALYSIS</text>
  <text x="36" y="440" class="mono white-text" font-size="11">[#] MOBILE DEVELOPMENT</text>
  
  <line x1="36" y1="460" x2="484" y2="460" stroke="#21262d" stroke-width="1"/>
  <text x="36" y="485" class="mono gray-text" font-size="11">ID: nadeen218  |  SYSTEM: DEVOS</text>

  <!-- Right Side Box (SYSTEM.INFO) -->
  <rect x="520" y="52" width="410" height="468" rx="8" fill="#010409" stroke="#21262d" stroke-width="1"/>

  <g class="mono">
    <text x="540" y="78" class="mono blue-text" font-size="13" font-weight="bold">SYSTEM.INFO</text>
    <line x1="540" y1="88" x2="910" y2="88" stroke="#30363d" stroke-dasharray="2 3"/>

    <!-- Personal Info -->
    <text x="540" y="115" font-size="12"><tspan class="blue-text">.Name</tspan><tspan class="gray-text"> ................. </tspan><tspan class="white-text" font-weight="bold">Nadeen Abu Hilweh</tspan></text>
    <text x="540" y="135" font-size="12"><tspan class="blue-text">.Role</tspan><tspan class="gray-text"> ................ </tspan><tspan class="white-text">Software Engineer</tspan></text>
    <text x="540" y="155" font-size="12"><tspan class="blue-text">.Focus</tspan><tspan class="gray-text"> ............... </tspan><tspan class="white-text">AI · Data · Mobile</tspan></text>
    <text x="540" y="175" font-size="12"><tspan class="blue-text">.Status</tspan><tspan class="gray-text"> .............. </tspan><tspan class="white-text">Building · Learning</tspan></text>

    <!-- Core Tech Stack -->
    <text x="540" y="230" font-size="12" class="blue-text" font-weight="bold">Core.AI <tspan class="gray-text" font-weight="normal">................. </tspan><tspan class="white-text" font-weight="normal">Python · ML · Data</tspan></text>
    <text x="540" y="250" font-size="12" class="blue-text" font-weight="bold">Core.Mobile <tspan class="gray-text" font-weight="normal">.............. </tspan><tspan class="white-text" font-weight="normal">Flutter · Dart</tspan></text>
    <text x="540" y="270" font-size="12" class="blue-text" font-weight="bold">Core.Frontend <tspan class="gray-text" font-weight="normal">............ </tspan><tspan class="white-text" font-weight="normal">React · Next.js</tspan></text>
    <text x="540" y="290" font-size="12" class="blue-text" font-weight="bold">Core.Backend <tspan class="gray-text" font-weight="normal">............. </tspan><tspan class="white-text" font-weight="normal">Node · Express · REST</tspan></text>
    <text x="540" y="310" font-size="12" class="blue-text" font-weight="bold">Core.Database <tspan class="gray-text" font-weight="normal">............ </tspan><tspan class="white-text" font-weight="normal">MySQL · MongoDB</tspan></text>
    <text x="540" y="330" font-size="12" class="blue-text" font-weight="bold">Core.Platform <tspan class="gray-text" font-weight="normal">............ </tspan><tspan class="white-text" font-weight="normal">Firebase · Supabase</tspan></text>

    <!-- Contact Details -->
    <text x="540" y="375" class="green-text" font-size="12" font-weight="bold">&gt; CONTACT</text>
    <text x="540" y="398" font-size="12"><tspan class="blue-text">GitHub</tspan><tspan class="gray-text"> ...................... </tspan><tspan class="white-text">nadeen218</tspan></text>
    <text x="540" y="420" font-size="12"><tspan class="blue-text">LinkedIn</tspan><tspan class="gray-text"> .................... </tspan><tspan class="white-text">in/nadeen-abu-hilweh</tspan></text>

    <!-- Bottom Status Bar -->
    <line x1="540" y1="450" x2="910" y2="450" stroke="#30363d" stroke-width="1"/>
    <circle cx="546" cy="480" r="4" fill="#3fb950" class="green-glow"/>
    <text x="558" y="484" class="green-text" font-size="11" font-weight="bold">ALL SYSTEMS OPERATIONAL</text>
  </g>
</svg>
